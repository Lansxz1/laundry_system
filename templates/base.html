{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Laundry System{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

  <!-- Minimalist Header / Navbar -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="{% url 'home' %}">🧺 Laundry System</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="{% url 'customer_list' %}">Customers</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'service_list' %}">Services</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'order_list' %}">Orders</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content Container -->
  <main class="container my-4">
    {% block content %}
    {% endblock %}
  </main>

</body>
</html>
