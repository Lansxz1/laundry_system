{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Laundry System{% endblock %}</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

  <!-- Top Banner -->
  <div class="top-announcement">
    ✨ Powerful Laundry Management Solutions • Eco-Friendly & Automated
  </div>

  <!-- Header Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dropps">
    <div class="container">
      <a class="navbar-brand" href="{% url 'home' %}">dropps<span style="color: var(--dropps-sky);">.ms</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item"><a class="nav-link" href="{% url 'order_list' %}">Orders</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'customer_list' %}">Customers</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'service_list' %}">Services</a></li>
        </ul>
        <a href="{% url 'order_create' %}" class="btn btn-dropps-navy">+ New Order</a>
      </div>
    </div>
  </nav>

  <!-- Main Area -->
  <main class="py-5">
    {% block content %}
    {% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
