{% extends 'base.html' %}

{% block title %}Delete service - Laundry System{% endblock %}

{% block content %}
<div class="confirm">
  <div class="panel panel-pad">
    <h1 class="h3 mb-2">Delete "{{ service.name }}"?</h1>
    <p class="muted">This removes the service and can't be undone.</p>
    <form method="post" class="form-actions">
      {% csrf_token %}
      <button type="submit" class="btn btn-red">Delete service</button>
      <a href="{% url 'service_list' %}" class="btn btn-line">Keep it</a>
    </form>
  </div>
</div>
{% endblock %}
