<h2>Services Management</h2>
<a href="{% url 'service_create' %}">+ Add New Service</a>
<table border="1" cellpadding="8" style="margin-top: 10px; border-collapse: collapse;">
    <tr>
        <th>Service Name</th>
        <th>Price per KG</th>
        <th>Description</th>
        <th>Actions</th>
    </tr>
    {% for service in services %}
    <tr>
        <td>{{ service.name }}</td>
        <td>₱{{ service.price_per_kg }}</td>
        <td>{{ service.description|default:"N/A" }}</td>
        <td>
            <a href="{% url 'service_update' service.pk %}">Edit</a> | 
            <a href="{% url 'service_delete' service.pk %}">Delete</a>
        </td>
    </tr>
    {% empty %}
    <tr><td colspan="4">No services created yet.</td></tr>
    {% endfor %}
</table>
